<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Driving Sim</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <canvas id="flight-hud" aria-hidden="true" hidden></canvas>
    <div id="g-desat" aria-hidden="true" hidden></div>
    <div id="g-veil" aria-hidden="true" hidden></div>

    <div id="loading">
      <div class="brand"><b id="brand-zone"></b> <span>DRIVE</span></div>
      <div class="loading-road" aria-hidden="true"><i></i></div>
      <div class="loading-line" role="status" data-i18n="load.map">Loading the map…</div>
    </div>

    <div id="plate" aria-live="polite">
      <b id="plate-ref" hidden></b>
      <span id="plate-name"></span>
    </div>

    <section id="cluster" aria-label="Speed">
      <div class="speed-row">
        <div id="speed">0</div>
        <div class="speed-side">
          <div id="gear">1</div>
          <div class="unit">km/h</div>
        </div>
      </div>
      <div id="rpm" aria-hidden="true"></div>
      <div id="alt" hidden></div>
    </section>

    <canvas id="minimap" aria-label="Map of the roads around the car"></canvas>

    <div id="message" role="status"></div>
    <div id="rotate" data-i18n="rotate">Turn your phone sideways to drive</div>

    <button type="button" id="boost-btn" data-i18n="touch.boost">BOOST</button>
    <nav id="touch-buttons" aria-label="Game">
      <button type="button" data-action="camera" data-i18n="touch.camera">CAM</button>
      <button type="button" data-action="transform" data-i18n="touch.fly">FLY</button>
      <button type="button" data-action="reset" data-i18n="touch.reset">RESET</button>
      <button type="button" data-action="menu" data-i18n="touch.menu">MENU</button>
      <button type="button" data-action="pause" data-i18n="touch.pause">PAUSE</button>
      <button type="button" data-action="replay" data-i18n="touch.replay">REPLAY</button>
    </nav>

    <div id="replay" hidden>
      <span data-i18n="replay.title">Replay</span><kbd>I</kbd>
      <div id="replay-track"><div id="replay-bar"></div></div>
    </div>

    <div id="paused" hidden>
      <h2 data-i18n="paused.title">Paused</h2>
      <button type="button" id="share-btn" data-i18n="paused.share">Share this moment</button>
      <input id="share-link" readonly hidden aria-label="Link to this moment" />
      <p data-i18n="paused.note">A link that starts here: this place, heading, speed, time of day and view. P to go on.</p>
    </div>

    <aside id="help">
      <h2><button type="button" id="help-toggle"><span data-i18n="ctl.title">Controls</span><span id="help-mode"></span> <kbd>H</kbd></button></h2>
      <div id="help-body"></div>
    </aside>

    <footer id="credits">
      <span class="credit-long">Terrain MDT05 &amp; PNOA </span>© <a href="https://www.ign.es" target="_blank" rel="noopener">IGN</a> (CC BY 4.0) · Roads © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors
      <span id="sha"></span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
